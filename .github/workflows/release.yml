name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            build_flags: '-nsis=false'
            artifact_name: windows_amd64
          - os: macos-latest
            platform: darwin/universal
            build_flags: ''
            artifact_name: darwin_universal
          - os: ubuntu-24.04
            platform: linux/amd64
            build_flags: '-tags webkit2_41' # Ubuntu 24.04 only ships webkit2gtk-4.1
            artifact_name: linux_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # wails build runs wails.json frontend:install + frontend:build itself
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -platform ${{ matrix.platform }} ${{ matrix.build_flags }} -ldflags "-X main.Version=${VERSION}"

      - name: Collect artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/bin/LLMGatewayProxy.exe -DestinationPath "dist/LLMGatewayProxy_${version}_windows_amd64.zip"

      - name: Collect artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cd build/bin
          ditto -c -k --keepParent LLMGatewayProxy.app "../../dist/LLMGatewayProxy_${VERSION}_darwin_universal.zip"

      - name: Collect artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -czf "dist/LLMGatewayProxy_${VERSION}_linux_amd64.tar.gz" -C build/bin LLMGatewayProxy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMGatewayProxy-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here — tell gh which repo to target
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "macOS builds are not code-signed. If the app is blocked on first run, remove the quarantine attribute: xattr -cr /Applications/LLMGatewayProxy.app" \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
